[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deliveryflow-backend"
version = "0.1.0"
description = "DeliveryFlow Backend — FastAPI service for SADC cross-border freight"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "taskiq[redis]>=0.11.0",
    "taskiq-redis>=0.2.0",
    "boto3>=1.34.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    # Document generation (open-source)
    "weasyprint>=69.0",
    "jinja2>=3.1.0",
    # LLM document extraction (from apex_ai-bot)
    "mistralai>=1.0.0",
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres,redis]>=4.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pyright>=1.1.370",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
